# ==================== CONFIG IMPORT (carica env.properties) ====================
spring.config.import=optional:file:./env.properties
# ==================== APPLICATION ====================
spring.application.name=epicode-bw2-spring-epic-energy-services-api
server.port=${PORT:8080}
# ==================== DATABASE CONFIGURATION (PostgreSQL) ====================
spring.datasource.url=jdbc:postgresql://localhost:5432/${PG_DB_NAME}
spring.datasource.username=${PG_USERNAME}
spring.datasource.password=${PG_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# ==================== JPA/HIBERNATE CONFIGURATION ====================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=create
# PRODUCTION: usa 'validate' o 'none'
# DEVELOPMENT: usa 'create' o 'update'
# ==================== JWT CONFIGURATION ====================
jwt.secret=${JWT_SECRET}
jwt.expirationms=${JWT_EXPIRATION_MS:604800000}
# ==================== OPENAPI / SWAGGER CONFIGURATION ====================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
# Accedi a: http://localhost:8080/swagger-ui.html
# ==================== LOGGING ====================
logging.level.org.springframework.security=DEBUG
# PRODUCTION: cambia a INFO o WARN
# ==================== SEED DATABASE ====================
app.seed.enabled=${app.seed.enabled:false}
