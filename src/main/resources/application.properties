# ==================== CONFIG IMPORT (carica env.properties) ====================
spring.config.import=optional:file:./env.properties
# ==================== APPLICATION ====================
spring.application.name=epicode-bw2-spring-epic-energy-services-api
server.port=${PORT:8080}
# ==================== DATABASE CONFIGURATION (PostgreSQL) ====================
spring.datasource.url=jdbc:postgresql://localhost:5432/${PG_DB_NAME}
spring.datasource.username=${PG_USERNAME}
spring.datasource.password=${PG_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# ==================== JPA/HIBERNATE CONFIGURATION ====================
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.ddl-auto=update
# PRODUCTION: usa 'validate' o 'none'
# DEVELOPMENT: usa 'create' (ricrea DB) o 'update' (aggiorna schema)
# ==================== JWT CONFIGURATION ====================
jwt.secret=${JWT_SECRET}
jwt.expirationms=${JWT_EXPIRATION_MS:604800000}
# ==================== OPENAPI / SWAGGER CONFIGURATION ====================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
# Accedi a: http://localhost:8080/swagger-ui.html
# ==================== LOGGING ====================
logging.level.org.springframework.security=DEBUG
# PRODUCTION: cambia a INFO o WARN
# ==================== SEED DATABASE ====================
app.seed.enabled=${app.seed.enabled:true}
# ==================== UTENTE ADMIN RUNNER  ====================
admin.email=${ADMIN_EMAIL}
admin.pwd=${ADMIN_PWD}
admin.username=${ADMIN_USERNAME}
admin.name=${ADMIN_NAME}
admin.lastname=${ADMIN_LASTNAME}
# Quando si deve importare Province/Comuni da CSV
app.import.enabled=true
# ==================== CLOUDINARY CONFIG ====================
cloudinary.name=${CLOUDINARY_NAME}
cloudinary.apikey=${CLOUDINARY_API_KEY}
cloudinary.secret=${CLOUDINARY_SECRET}
# ==================== MAILGUN CONFIG ====================
mailgun.domain=${MAILGUN_DOMAIN}
mailgun.apiKey=${MAILGUN_API_KEY}
